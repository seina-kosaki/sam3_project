# 解析結果の出力先。相対パスはpyproject.tomlのあるプロジェクトルート基準です。
# シンボリックリンクを含め、プロジェクトルート外へ解決されるパスは使用できません。
output_root: results_analyze

# 解析対象は1件以上指定してください。条件を複数書くとOR条件になり、重複するセッションは1回だけ解析します。
# dateにはcapture_root直下の日付ディレクトリ名（YYYY-MM-DD）を指定します。
# session_idは省略するとその日付の全セッション、指定するとそのセッションだけを選びます。
# 以下の例から使う形式を選び、そのtargetsブロックだけを有効にしてください。
#
# 例1: 2026-11-24の全セッションを解析する
# targets:
#   - date: "2026-11-24"
#
# 例2: 2026-11-24のsession_001だけを解析する
# targets:
#   - date: "2026-11-24"
#     session_id: "session_001"
#
# 例3: ある日付の全セッションと、別日の特定セッションを解析する
# targets:
#   - date: "2026-11-24"
#   - date: "2026-11-25"
#     session_id: "session_002"
#
# session_idだけの指定や空のtargetsは使用できません。
targets: 
  - date: "2026-11-12"

